name: sana
x-runtime: &runtime
  image: sana-local:development
  build:
    context: .
    dockerfile: backend/Dockerfile
  env_file:
    - path: .env
      required: false
  environment: &environment
    SANA_DATABASE_URL: postgresql+psycopg://sana:${POSTGRES_PASSWORD:-sana_local_only}@db:5432/sana
    SANA_REDIS_URL: redis://redis:6379/0
    SANA_STORAGE_DIR: /data/assets
    SANA_MODEL_CACHE_DIR: /data/models
    SANA_LLM_BASE_URL: ${SANA_DOCKER_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
  volumes:
    - assets:/data/assets
    - models:/data/models
  networks: [default, data]
  extra_hosts: ["host.docker.internal:host-gateway"]
  init: true

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sana
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sana_local_only}
      POSTGRES_DB: sana
    volumes: ["postgres:/var/lib/postgresql/data"]
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sana -d sana"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: ["redis:/data"]
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    <<: *runtime
    command: ["sh", "-c", "uv run --frozen --no-sync alembic upgrade head && uv run --frozen --no-sync python -m app.manage seed-plans"]
    depends_on:
      db: {condition: service_healthy}
  api:
    <<: *runtime
    command: ["uv", "run", "--frozen", "--no-sync", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 5
  worker:
    <<: *runtime
    command: ["uv", "run", "--frozen", "--no-sync", "celery", "-A", "app.worker:celery_app", "worker", "--loglevel=INFO", "--concurrency=1"]
    stop_grace_period: 60s
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "uv run --frozen --no-sync celery -A app.worker:celery_app inspect ping --destination celery@$$HOSTNAME --timeout 3"]
      interval: 60s
      timeout: 10s
      retries: 3

networks:
  data: {internal: true}
volumes:
  postgres:
  redis:
  assets:
  models:
