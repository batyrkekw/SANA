[project]
name = "sana-api"
version = "0.1.0"
description = "SANA accounts, materials, transactional quotas and background AI"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.162.0", "uvicorn[standard]==0.54.0", "pydantic==2.14.1",
  "pydantic-settings==2.16.1", "sqlalchemy==2.0.55", "alembic==1.20.1",
  "psycopg[binary]==3.3.6", "pyjwt[crypto]==2.15.1", "httpx==0.28.1",
  "celery[redis]==5.6.3", "redis==6.4.0", "pillow==12.3.0",
]

[project.optional-dependencies]
ai = [
  "torch==2.14.1", "diffusers==0.39.0", "transformers==4.57.6",
  "accelerate==1.15.0", "safetensors==0.8.0", "huggingface-hub==0.36.2",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["postgres: requires TEST_DATABASE_URL pointing to a disposable PostgreSQL database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
